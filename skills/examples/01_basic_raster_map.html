<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Leaflet - High-DPI Raster Map & Custom Popup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
    #map { height: 100vh; width: 100vw; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // Get free API key at: https://docs.maptiler.com/cloud/api/authentication-key/
    const API_KEY = "YOUR_API_KEY";

    const map = L.map('map').setView([50.0755, 14.4378], 14);

    // CRITICAL: tileSize: 512 & zoomOffset: -1 for crisp 512px tiles!
    L.tileLayer(`https://api.maptiler.com/maps/streets-v4/{z}/{x}/{y}.png?key=${API_KEY}`, {
      tileSize: 512,
      zoomOffset: -1,
      minZoom: 1,
      maxZoom: 22,
      attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OSM</a>',
      crossOrigin: true
    }).addTo(map);

    L.marker([50.0755, 14.4378])
      .addTo(map)
      .bindPopup('<b>Welcome to Prague!</b><br>Powered by Leaflet and MapTiler.')
      .openPopup();
  </script>
</body>
</html>
