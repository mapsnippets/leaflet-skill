<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Leaflet - Marker Clustering</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
    #map { height: 100vh; width: 100vw; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // Get free API key at: https://docs.maptiler.com/cloud/api/authentication-key/
    const API_KEY = "YOUR_API_KEY";

    const map = L.map('map').setView([50.0755, 14.4378], 11);

    L.tileLayer(`https://api.maptiler.com/maps/streets-v4/{z}/{x}/{y}.png?key=${API_KEY}`, {
      tileSize: 512, zoomOffset: -1, minZoom: 1, maxZoom: 22
    }).addTo(map);

    const markers = L.markerClusterGroup({ chunkedLoading: true, spiderfyOnMaxZoom: true });

    for (let i = 0; i < 400; i++) {
      const lat = 50.0755 + (Math.random() - 0.5) * 0.3;
      const lng = 14.4378 + (Math.random() - 0.5) * 0.4;
      const m = L.marker([lat, lng]).bindPopup(`<b>Station #${i+1}</b>`);
      markers.addLayer(m);
    }

    map.addLayer(markers);
  </script>
</body>
</html>
